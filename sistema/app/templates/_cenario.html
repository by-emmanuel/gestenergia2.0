{# Cenario de fundo da pagina inicial e do login: ceu, serras, colinas e um
   aerogerador em primeiro plano. Desenhado em SVG para funcionar sem internet
   (a maquina do laboratorio pode estar offline) e sem imagem de terceiros. #}
<svg class="cenario" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"
     aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6d9c"/>
      <stop offset="0.45" stop-color="#7fa3c6"/>
      <stop offset="0.75" stop-color="#b7cde0"/>
      <stop offset="1" stop-color="#d7e3ec"/>
    </linearGradient>
    <linearGradient id="colina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8a3e"/>
      <stop offset="1" stop-color="#2c4f27"/>
    </linearGradient>
    <linearGradient id="torre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3ccd4"/>
      <stop offset="0.35" stop-color="#f7f9fa"/>
      <stop offset="1" stop-color="#b9c3cc"/>
    </linearGradient>
    <linearGradient id="nacele" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="0.6" stop-color="#e4e9ee"/>
      <stop offset="1" stop-color="#b8c2cb"/>
    </linearGradient>
    <linearGradient id="pa-cor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5dce3"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d0d8"/>
    </linearGradient>
    <radialGradient id="cubo" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c2ccd5"/>
    </radialGradient>

    <filter id="desfoque-forte" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="desfoque-medio" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="desfoque-leve" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    {# Uma pa, apontando para cima a partir do cubo (0,0). #}
    <path id="pa" d="M -18 -30 Q -26 -220 -7 -650 Q 0 -668 8 -652 Q 24 -260 18 -30 Z"/>
    <clipPath id="recorte-pa"><use href="#pa"/></clipPath>
    <g id="pa-completa">
      <use href="#pa" fill="url(#pa-cor)"/>
      <rect x="-30" y="-640" width="60" height="56" fill="#d9534f" clip-path="url(#recorte-pa)"/>
    </g>
  </defs>

  {# Ceu e nuvens #}
  <rect width="1600" height="1000" fill="url(#ceu)"/>
  <g fill="#ffffff" filter="url(#desfoque-forte)">
    <ellipse cx="320" cy="120" rx="260" ry="50" opacity="0.45"/>
    <ellipse cx="900" cy="190" rx="170" ry="55" opacity="0.6"/>
    <ellipse cx="1000" cy="160" rx="110" ry="45" opacity="0.5"/>
    <ellipse cx="620" cy="330" rx="300" ry="40" opacity="0.35"/>
    <ellipse cx="1350" cy="280" rx="220" ry="45" opacity="0.4"/>
  </g>

  {# Serras ao fundo, fora de foco #}
  <path d="M0 640 L140 560 L260 600 L420 500 L560 580 L700 520 L860 600 L1000 540 L1180 610 L1340 550 L1600 620 L1600 1000 L0 1000 Z"
        fill="#6a89a8" filter="url(#desfoque-medio)"/>
  <path d="M0 700 L180 630 L340 680 L520 610 L700 690 L880 640 L1060 700 L1260 650 L1600 720 L1600 1000 L0 1000 Z"
        fill="#46677f" filter="url(#desfoque-medio)"/>

  {# Aerogeradores distantes #}
  <g filter="url(#desfoque-leve)" opacity="0.75">
    <g transform="translate(300 700) scale(0.16)">
      <polygon points="-10,0 10,0 18,700 -18,700" fill="#e8edf1"/>
      <g class="rotor rotor-lento"><use href="#pa-completa"/><use href="#pa-completa" transform="rotate(120)"/><use href="#pa-completa" transform="rotate(240)"/></g>
    </g>
    <g transform="translate(470 730) scale(0.11)">
      <polygon points="-10,0 10,0 18,700 -18,700" fill="#e8edf1"/>
      <g class="rotor rotor-medio"><use href="#pa-completa"/><use href="#pa-completa" transform="rotate(120)"/><use href="#pa-completa" transform="rotate(240)"/></g>
    </g>
  </g>

  {# Colinas verdes #}
  <path d="M0 800 Q 220 720 460 770 T 960 760 T 1600 790 L1600 1000 L0 1000 Z"
        fill="url(#colina)" filter="url(#desfoque-medio)"/>
  <path d="M0 880 Q 300 820 640 870 T 1600 860 L1600 1000 L0 1000 Z"
        fill="#24421f" filter="url(#desfoque-medio)" opacity="0.9"/>

  {# Aerogerador em primeiro plano #}
  <polygon points="1205,420 1275,420 1300,1000 1180,1000" fill="url(#torre)"/>
  <rect x="1180" y="330" width="460" height="120" rx="58" fill="url(#nacele)"/>
  <rect x="1470" y="372" width="170" height="12" fill="#c9424a" opacity="0.85"/>
  <g transform="translate(1210 390)">
    <g class="rotor rotor-principal">
      <use href="#pa-completa"/>
      <use href="#pa-completa" transform="rotate(120)"/>
      <use href="#pa-completa" transform="rotate(240)"/>
    </g>
    <ellipse cx="-6" cy="0" rx="52" ry="56" fill="url(#cubo)"/>
  </g>
</svg>
